<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Explorer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Heading -->
        <header class="text-center mb-5">
            <h1>🌦️ Weather Explorer</h1>
            <p>Discover the weather in your city</p>
        </header>

        <!-- Search Section -->
        <div class="weather-card mx-auto">

            <form id="weather-form">

                <label for="city-input" class="form-label">
                    Enter City Name
                </label>

                <div class="input-group mb-3">

                    <input
                        type="text"
                        id="city-input"
                        class="form-control"
                        placeholder="Example: Hyderabad"
                        required
                    >

                    <button type="submit" class="btn btn-primary">
                        Search
                    </button>

                </div>

            </form>

            <!-- Loading Message -->
            <p id="loading" class="text-center" hidden>
                Loading weather...
            </p>

            <!-- Error Message -->
            <p id="error-message" class="text-danger text-center" role="alert"></p>

            <!-- Weather Results -->
            <section id="weather-result" class="text-center" hidden>

                <h2 id="city-name"></h2>

                <div class="weather-icon" id="weather-icon">🌤️</div>

                <h3 id="temperature"></h3>

                <p id="weather-description"></p>

                <div class="row mt-4">

                    <div class="col-6">
                        <div class="weather-detail">
                            <p>💧 Humidity</p>
                            <h4 id="humidity"></h4>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="weather-detail">
                            <p>💨 Wind Speed</p>
                            <h4 id="wind-speed"></h4>
                        </div>
                    </div>

                </div>

            </section>

        </div>

        <!-- Footer -->
        <footer class="text-center mt-5">
            <p>Built with HTML, CSS, JavaScript & Open-Meteo API</p>
        </footer>

    </div>

    <!-- Our JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
